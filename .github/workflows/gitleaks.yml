name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # 탐지 시 PR 코멘트

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 전체 히스토리를 훑는다
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # 로컬 훅(winget 8.30.1)과 같은 판정을 쓴다. .gitleaks.toml의 [[allowlists]]·targetRules는
          # 8.25 이후 문법이라 액션 기본값(8.24.x)에서는 적용되지 않는다.
          GITLEAKS_VERSION: 8.30.1
          # 개인 계정 저장소라 GITLEAKS_LICENSE 불필요. 조직으로 옮기면 필요.
