[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deliciousmap"
version = "0.1.0"
description = "Municipal expense pipeline contracts and CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["mypy>=1.19,<2", "pytest>=9,<10", "ruff>=0.15,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/deliciousmap"]
